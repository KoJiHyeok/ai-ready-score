name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Validate CLI on repository
        run: node bin/ai-ready-score.js .

      - name: Validate Korean output
        run: node bin/ai-ready-score.js . --lang ko

      - name: Validate English output
        run: node bin/ai-ready-score.js . --lang en

      - name: Validate JSON output
        run: node bin/ai-ready-score.js . --json

      - name: Validate Markdown output
        run: node bin/ai-ready-score.js . --markdown

      - name: Validate Markdown Korean output
        run: node bin/ai-ready-score.js . --markdown --lang ko

      - name: Validate Markdown English output
        run: node bin/ai-ready-score.js . --markdown --lang en

      - name: Validate CLI on good example
        run: node bin/ai-ready-score.js ./examples/good-project

      - name: Validate CLI on poor example
        run: node bin/ai-ready-score.js ./examples/poor-project

      - name: Validate help output
        run: node bin/ai-ready-score.js --help

      - name: Validate version output
        run: node bin/ai-ready-score.js --version
